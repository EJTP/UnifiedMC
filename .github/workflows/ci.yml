name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shell:
    name: Python shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes minecraft-launcher-lib dnspython pillow
      - run: python -m pyflakes unifiedmc.py
      # the self-check needs no network, which is the point of it
      - run: python unifiedmc.py demo

  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      # tauri does not build on linux without these
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile
        working-directory: launcher
      # pnpm check, not svelte-check directly: the tsconfig it needs is generated by
      # svelte-kit sync, which the check script runs first. A clean checkout has neither.
      - run: pnpm check
        working-directory: launcher
      - run: cargo fmt --check
        working-directory: launcher/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: launcher/src-tauri
      - run: cargo test
        working-directory: launcher/src-tauri


name: Release

# Two ways in: pushing a v-tag builds for that tag, and the button on the Actions page builds
# for whichever existing tag you name. The second one is what you want when a release is
# already out and only one platform is missing from it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to attach the build to
        required: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: launcher

      # The key is read at compile time; a build without the secret is Modrinth only, which is
      # a smaller catalogue rather than a failure, so this does not gate the build.
      - run: pnpm tauri build
        working-directory: launcher
        env:
          UNIFIEDMC_CF_KEY: ${{ secrets.UNIFIEDMC_CF_KEY }}

      # The CLI is a second binary out of the same crate: it turns a modpack into a server
      # directory, which is the other half of this project and useless if you have to build it
      # yourself first.
      - run: cargo build --release --bin unifiedmc-server-cli
        working-directory: launcher/src-tauri
        env:
          UNIFIEDMC_CF_KEY: ${{ secrets.UNIFIEDMC_CF_KEY }}

      - name: Attach the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          # WiX writes an .msi, NSIS an .exe. Both are wanted: the msi for anyone deploying it,
          # the exe for a person who just wants to double-click something.
          files=$(find launcher/src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*-setup.exe' \))
          cli=launcher/src-tauri/target/release/unifiedmc-server-cli.exe
          test -f "$cli" && files="$files $cli"
          test -n "$files" || { echo "nothing was bundled"; exit 1; }
          echo "$files"
          gh release upload "$tag" $files --clobber

  macos:
    name: macOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Both architectures, because what ships is a universal bundle: an Intel Mac and an
      # Apple Silicon one download the same file and neither has to work out which it is.
      # That is the same promise the launcher makes about Minecraft versions.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: launcher

      # Before the bundle, not after it. This crate builds two binaries, and Tauri's macOS
      # bundler copies every one of them into the .app - but "universal-apple-darwin" is not a
      # real cargo target, so Tauri lipos only the main binary into that directory and the
      # bundle then fails on the missing second one. Putting it there first is the whole fix.
      #
      # Elsewhere this never comes up: a plain `cargo build --release` writes both binaries to
      # the one directory the bundler reads.
      - name: Build the server CLI for both architectures
        working-directory: launcher/src-tauri
        env:
          UNIFIEDMC_CF_KEY: ${{ secrets.UNIFIEDMC_CF_KEY }}
        run: |
          set -e
          for arch in aarch64 x86_64; do
            cargo build --release --bin unifiedmc-server-cli --target "$arch-apple-darwin"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/unifiedmc-server-cli \
            target/aarch64-apple-darwin/release/unifiedmc-server-cli \
            target/x86_64-apple-darwin/release/unifiedmc-server-cli
          # A copy under its own name, for the release page.
          cp target/universal-apple-darwin/release/unifiedmc-server-cli unifiedmc-server-cli-macos
          lipo -info unifiedmc-server-cli-macos

      # No APPLE_* here on purpose. Tauri decides to sign by whether those variables are
      # *set*, not by whether they hold anything, so wiring them up to secrets that do not
      # exist yet hands it an empty certificate to import and takes the whole bundle down
      # with it - which is exactly how v0.1.8 failed the first time.
      #
      # To sign, once there is a Developer ID: add APPLE_CERTIFICATE (base64 of the .p12),
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, and for notarisation APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID as an env block on this step. Until then the .dmg is
      # unsigned, which installs fine - Gatekeeper just makes the first open a two-step
      # affair, and the README says how.
      - run: pnpm tauri build --target universal-apple-darwin
        working-directory: launcher
        env:
          UNIFIEDMC_CF_KEY: ${{ secrets.UNIFIEDMC_CF_KEY }}


      - name: Attach the disk image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          # The .dmg alone. Tauri also leaves the .app next to it, but that is a directory,
          # and a release asset has to be one file.
          files=$(find launcher/src-tauri/target/universal-apple-darwin/release/bundle \
            -type f -name '*.dmg')
          cli=launcher/src-tauri/unifiedmc-server-cli-macos
          test -f "$cli" && files="$files $cli"
          test -n "$files" || { echo "nothing was bundled"; exit 1; }
          echo "$files"
          gh release upload "$tag" $files --clobber

  linux:
    name: Linux
    # 22.04, not latest: a binary links against the glibc it was built on and runs on that
    # version or newer, never older. Building on the newest runner would quietly refuse to
    # start on every distro a year behind it.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      # tauri does not build on linux without these, and the AppImage bundler shells out to
      # patchelf and needs a FUSE library present to assemble the image.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - run: pnpm install --frozen-lockfile
        working-directory: launcher

      - run: pnpm tauri build
        working-directory: launcher
        env:
          UNIFIEDMC_CF_KEY: ${{ secrets.UNIFIEDMC_CF_KEY }}

      - run: cargo build --release --bin unifiedmc-server-cli
        working-directory: launcher/src-tauri
        env:
          UNIFIEDMC_CF_KEY: ${{ secrets.UNIFIEDMC_CF_KEY }}

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          # Three, because Linux does not have one answer: the AppImage for anyone who wants
          # to download and run, the deb and the rpm for the two families that would rather
          # their package manager knew about it.
          files=$(find launcher/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))
          cli=launcher/src-tauri/target/release/unifiedmc-server-cli
          if [ -f "$cli" ]; then
            cp "$cli" unifiedmc-server-cli-linux
            files="$files unifiedmc-server-cli-linux"
          fi
          test -n "$files" || { echo "nothing was bundled"; exit 1; }
          echo "$files"
          gh release upload "$tag" $files --clobber

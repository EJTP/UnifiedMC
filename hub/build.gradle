plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	maven { name = 'Wisp Forest'; url = 'https://maven.wispforest.io' }
	maven { name = 'JitPack'; url = 'https://jitpack.io' }   // owo-lib pulls kdl4j from here
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// owo-ui: declarative layout with real sizing, so the screens scale instead of being
	// hand-placed at fixed pixel offsets
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

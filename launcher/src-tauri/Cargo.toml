[package]
name = "launcher"
version = "0.1.2"
description = "A launcher for one modded Minecraft server"
authors = ["EJTP"]
license = "MIT"
edition = "2021"
# two binaries now, so tauri has to be told which one is the app
default-run = "launcher"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "launcher"
path = "src/main.rs"

[[bin]]
# The server-side companion. Shares the pack reader and catalogue with the launcher,
# because "which mods does this pack need and which side is each one for" is one question.
name = "unifiedmc-server-cli"
path = "src/bin/cli.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: download_necessary() hashes nothing it fetches in the run that fetches it, so what
# this version does on the wire is a known ceiling rather than a moving one. See play.rs.
lyceris = "=1.1.3"
tokio = { version = "1.53.1", features = ["full"] }
sha1 = "0.11.0"
hex = "0.4.3"
anyhow = "1.0.104"
dirs = "6.0.0"
futures = "0.3.34"
# "form": the Microsoft token endpoints are urlencoded, not JSON, all the way through.
reqwest = { version = "0.13.4", features = ["json", "query", "form"] }
md5 = "0.8.1"
base64 = "0.23.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
bytes = "1.12.1"
toml = "1.1.4"
hickory-resolver = "0.26.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# already in the tree under reqwest; direct because an admin token needs a CSPRNG and std
# offers none - RandomState is a hash seed, not a source of credentials
getrandom = "0.3"


[package]
name = "launcher"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# The server-side companion. Shares the pack reader and catalogue with the launcher,
# because "which mods does this pack need and which side is each one for" is one question.
name = "unifiedmc-server-cli"
path = "src/bin/cli.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lyceris = "1.1.3"
tokio = { version = "1.53.1", features = ["full"] }
sha1 = "0.11.0"
hex = "0.4.3"
anyhow = "1.0.104"
dirs = "6.0.0"
futures = "0.3.34"
reqwest = { version = "0.13.4", features = ["json", "query"] }
md5 = "0.8.1"
base64 = "0.23.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
bytes = "1.12.1"

